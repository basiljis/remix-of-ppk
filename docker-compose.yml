# Timeweb Cloud Apps — Docker Compose deployment
# Redeploy trigger: 2026-06-07 - Timeweb optimization

services:
  # ---------------------------------------------------------------
  # Edge-прокси. Точка входа. Остаётся живым во время деплоя app
  # и автоматически показывает /maintenance.html при недоступности.
  # ---------------------------------------------------------------
  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__edge_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------
  # Основное приложение (SPA + reverse-proxy на Supabase).
  # Порт наружу НЕ публикуется — доступ только через edge.
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    expose:
      - "8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/index.html"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
